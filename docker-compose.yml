# Настройки берутся из .env в корне (шаблон — .env.example).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Накатывает миграции общей схемы и завершается.
  # Сервисы, которым нужна БД, ставят:
  #   depends_on:
  #     migrate:
  #       condition: service_completed_successfully
  migrate:
    build: ./db
    command: ["up"]
    environment:
      # внутри сети compose Postgres всегда слушает 5432, POSTGRES_PORT — только порт на хосте
      DATABASE_URL: postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  # Брокер сообщений (KRaft, один узел): события о задачах на сбор данных.
  # Внутри compose — kafka:9092, с хоста — localhost:${KAFKA_PORT:-9094}.
  kafka:
    image: apache/kafka:4.1.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # топики создают publisher и worker при старте
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "${KAFKA_PORT:-9094}:9094"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
    restart: unless-stopped

  # Топики, сообщения и лаг consumer group в браузере: http://localhost:${KAFKA_UI_PORT:-8086}
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "${KAFKA_UI_PORT:-8086}:8080"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # API: регистрация заявителя (users, companies, черновик заявки) и анкета с файлами →
  # заявка SUBMITTED, documents, задача на сбор и события в outbox одной транзакцией.
  data-collector:
    build: ./data-collector
    environment:
      HTTP_ADDR: :8081
      DATABASE_URL: postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}?sslmode=disable
      BANK_API_URL: http://mock-api:8090/bank/v1
      BANK_API_TIMEOUT: 5s
      # файлы документов; этот же volume на чтение — у worker'а проверки подписи (и будущего OCR)
      DOCUMENTS_DIR: /data/documents
    volumes:
      - documents:/data/documents
    ports:
      - "${DATA_COLLECTOR_PORT:-8081}:8081"
    depends_on:
      migrate:
        condition: service_completed_successfully
      mock-api:
        condition: service_started
    restart: unless-stopped

  # outbox → Kafka: события о задачах на сбор и о документах заявок.
  data-collector-publisher:
    build: ./data-collector
    entrypoint: ["/data-collector-publisher"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}?sslmode=disable
      KAFKA_BROKERS: kafka:9092
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # Kafka → задача RUNNING (заявка ENRICHING) → опрос всех моков → raw_collections,
  # задача COMPLETED (заявка VERIFYING), реквизиты компании из ЕГРЮЛ.
  data-collector-worker:
    build: ./data-collector
    entrypoint: ["/data-collector-worker"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      MOCK_API_URL: http://mock-api:8090
      MOCK_API_TIMEOUT: 5s
      COLLECT_TIMEOUT: 8s
      WORKER_CONCURRENCY: 4
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      mock-api:
        condition: service_started
    restart: unless-stopped

  # Kafka (data-collector.documents) → проверка ЭП документов заявки: файлы — из volume documents
  # (только чтение), полномочия — из собранных ответов ЕГРЮЛ и МЧД → signature_reports, documents.signature_state.
  # Профиль TEST: тестовые корни и CRL из data-collector/testdata/signature/trust (go run ./tools/sigdemo),
  # это не проверка УКЭП. В образ тестовые корни не входят — только монтируются здесь.
  data-collector-signature-worker:
    build: ./data-collector
    entrypoint: ["/data-collector-signature-worker"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      DOCUMENTS_DIR: /data/documents
      SIGNATURE_PROFILE: TEST
      SIGNATURE_TRUST_DIR: /etc/signature/trust
      # сколько ждать завершения сбора данных (ЕГРЮЛ, МЧД) перед проверкой полномочий
      SIGNATURE_AUTHORITY_WAIT: 20s
      WORKER_CONCURRENCY: 4
    volumes:
      - documents:/data/documents:ro
      - ./data-collector/testdata/signature/trust:/etc/signature/trust:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # Эмулятор внешних систем: свой префикс на каждую систему (список — mock-api/README.md)
  # и старый /bank/v1, который вызывает data-collector.
  mock-api:
    build: ./mock-api
    environment:
      HTTP_ADDR: :8090
    ports:
      - "${MOCK_API_PORT:-8090}:8090"
    restart: unless-stopped

  # Кабинет клиента и рабочее место банка: http://localhost:${FRONTEND_PORT:-3000}
  # Пока API нет, данные отдают моки MSW в браузере (FRONTEND_API_MOCK=true).
  # Когда появится сервис API, поставить FRONTEND_API_MOCK=false и указать его адрес в FRONTEND_API_UPSTREAM.
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_MOCK: ${FRONTEND_API_MOCK:-true}
    environment:
      API_UPSTREAM: ${FRONTEND_API_UPSTREAM:-http://api:8080}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    restart: unless-stopped

  # Логи всех контейнеров в браузере: http://localhost:${DOZZLE_PORT:-8888}
  dozzle:
    image: amir20/dozzle:latest
    environment:
      DOZZLE_NO_ANALYTICS: "true"
    ports:
      - "${DOZZLE_PORT:-8888}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

volumes:
  pgdata:
  kafkadata:
  documents:
