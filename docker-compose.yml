# Настройки берутся из .env в корне (шаблон — .env.example).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Накатывает миграции общей схемы и завершается.
  # Сервисы, которым нужна БД, ставят:
  #   depends_on:
  #     migrate:
  #       condition: service_completed_successfully
  migrate:
    build: ./db
    command: ["up"]
    environment:
      # внутри сети compose Postgres всегда слушает 5432, POSTGRES_PORT — только порт на хосте
      DATABASE_URL: postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  data-collector:
    build: ./data-collector
    environment:
      HTTP_ADDR: :8081
      # сырые ответы всех систем по анкете → таблица raw_collections
      DATABASE_URL: postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}?sslmode=disable
      MOCK_API_URL: http://mock-api:8090
      MOCK_API_TIMEOUT: 5s
      BANK_API_URL: http://mock-api:8090/bank/v1
      BANK_API_TIMEOUT: 5s
    ports:
      - "${DATA_COLLECTOR_PORT:-8081}:8081"
    depends_on:
      migrate:
        condition: service_completed_successfully
      mock-api:
        condition: service_started
    restart: unless-stopped

  # Эмулятор внешних систем: свой префикс на каждую систему (список — mock-api/README.md)
  # и старый /bank/v1, который вызывает data-collector.
  mock-api:
    build: ./mock-api
    environment:
      HTTP_ADDR: :8090
    ports:
      - "${MOCK_API_PORT:-8090}:8090"
    restart: unless-stopped

  # Логи всех контейнеров в браузере: http://localhost:${DOZZLE_PORT:-8888}
  dozzle:
    image: amir20/dozzle:latest
    environment:
      DOZZLE_NO_ANALYTICS: "true"
    ports:
      - "${DOZZLE_PORT:-8888}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

volumes:
  pgdata:
