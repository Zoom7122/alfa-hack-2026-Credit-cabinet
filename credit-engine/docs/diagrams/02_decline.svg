<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="780" viewBox="0 0 1100 780" role="img" aria-labelledby="title desc">
<title id="title">UC-02. Отказ по результатам скоринга</title>
<desc id="desc">Достаточно одного подтверждённого основания для отказа по правилам модели.</desc>
<rect width="1100" height="780" fill="white"/>
<g font-family="Arial, sans-serif">
<text x="550" y="36" text-anchor="middle" dominant-baseline="central" font-size="34" font-weight="700" fill="#102640">UC-02. Отказ по результатам скоринга</text>
<text x="550" y="75" text-anchor="middle" dominant-baseline="central" font-size="21" font-weight="400" fill="#475569">Достаточно одного подтверждённого основания для отказа по правилам модели.</text>
<polyline points="267.5,315 267,400 550,400 550,485" fill="none" stroke="#718096" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="550,485 545.315,475.048 554.685,475.048" fill="#718096"/>
<polyline points="832.5,315 832,400 550,400 550,485" fill="none" stroke="#718096" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="550,485 545.315,475.048 554.685,475.048" fill="#718096"/>
<rect x="55" y="170" width="425" height="145" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="267.5" y="224.5" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="700" fill="#16366d">МС1</text>
<text x="267.5" y="256" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="400" fill="#16366d">Итоговый балл ниже порога отказа</text>
<rect x="620" y="170" width="425" height="145" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="832.5" y="224.5" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="700" fill="#16366d">МС1</text>
<text x="832.5" y="256" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="400" fill="#16366d">Подтверждён стоп-фактор</text>
<rect x="330" y="485" width="440" height="115" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="550" y="524.5" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="700" fill="#991b1b">МС1 → клиент</text>
<text x="550" y="556" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="700" fill="#991b1b">Отклонено</text>
<text x="550" y="732" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="400" fill="#475569">МС2 не вызывается. В админку ничего не отправляется. Состояние банка не меняется.</text>
</g>
</svg>
