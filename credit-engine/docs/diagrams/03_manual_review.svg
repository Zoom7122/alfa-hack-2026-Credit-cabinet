<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1030" viewBox="0 0 1100 1030" role="img" aria-labelledby="title desc">
<title id="title">UC-03. Решение должен принять сотрудник</title>
<desc id="desc">Спорный случай передаётся человеку. На уведомлении администратора сценарий заканчивается.</desc>
<rect width="1100" height="1030" fill="white"/>
<g font-family="Arial, sans-serif">
<text x="550" y="36" text-anchor="middle" dominant-baseline="central" font-size="34" font-weight="700" fill="#102640">UC-03. Решение должен принять сотрудник</text>
<text x="550" y="75" text-anchor="middle" dominant-baseline="central" font-size="21" font-weight="400" fill="#475569">Спорный случай передаётся человеку. На уведомлении администратора сценарий заканчивается.</text>
<polyline points="550,260 550,365" fill="none" stroke="#718096" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="550,365 545.315,355.048 554.685,355.048" fill="#718096"/>
<polyline points="550,485 550,565 267,565 267.5,680" fill="none" stroke="#718096" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="267.5,680 262.771,670.068 272.142,670.027" fill="#718096"/>
<rect x="213.5" y="527" width="103.0" height="26" rx="3" fill="white" stroke="white" stroke-width="2"/>
<text x="265" y="540" text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="400" fill="#475569">В админку</text>
<polyline points="550,485 550,565 832,565 832.5,680" fill="none" stroke="#718096" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="832.5,680 827.771,670.068 837.142,670.027" fill="#718096"/>
<rect x="751.5" y="527" width="167.0" height="26" rx="3" fill="white" stroke="white" stroke-width="2"/>
<text x="835" y="540" text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="400" fill="#475569">Ответ через МС1</text>
<rect x="330" y="135" width="440" height="125" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="550" y="165.5" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="700" fill="#16366d">МС1</text>
<text x="550" y="197" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="400" fill="#16366d">Скоринг требует ручного</text>
<text x="550" y="225" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="400" fill="#16366d">рассмотрения</text>
<rect x="330" y="365" width="440" height="120" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="550" y="393" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="700" fill="#4c1d95">МС1 → МС2 · REST</text>
<text x="550" y="424.5" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="400" fill="#4c1d95">Передаёт заявку, запрошенные</text>
<text x="550" y="452.5" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="400" fill="#4c1d95">условия и причины ручной проверки</text>
<rect x="55" y="680" width="425" height="145" rx="14" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
<text x="267.5" y="720.5" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="700" fill="#1e293b">МС2 → МС3 · REST</text>
<text x="267.5" y="752" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="400" fill="#1e293b">Заявка для ручного решения: ID,</text>
<text x="267.5" y="780" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="400" fill="#1e293b">данные, условия и причины</text>
<rect x="620" y="680" width="425" height="145" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="832.5" y="734.5" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="700" fill="#92400e">МС1 → клиент</text>
<text x="832.5" y="766" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="700" fill="#92400e">Заявка на рассмотрении</text>
<text x="550" y="982" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="400" fill="#475569">МС2 только передаёт обращение. Выдачи и изменения состояния банка нет.</text>
</g>
</svg>
