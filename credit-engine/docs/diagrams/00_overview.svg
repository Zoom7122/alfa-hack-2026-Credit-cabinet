<text x="1185" y="1274.5" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="700" fill="#92400e">МС1 → клиент</text>
<text x="1185" y="1306" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="700" fill="#92400e">Заявка на рассмотрении</text>
