<text x="700" y="1578.5" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="400" fill="#4c1d95">Выдача допустима?</text>
<rect x="40" y="1740" width="560" height="120" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="320" y="1768" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="700" fill="#4c1d95">МС2 → МС3</text>
<text x="320" y="1799.5" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="400" fill="#4c1d95">Сообщает о проблемах банка; состояние не</text>
<text x="320" y="1827.5" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="400" fill="#4c1d95">меняет</text>
