<text x="1080" y="1954.5" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="700" fill="#166534">МС1 → клиент</text>
<text x="1080" y="1986" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="700" fill="#166534">Одобрено</text>
<rect x="500" y="1115" width="400" height="110" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="700" y="1152" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="700" fill="#16366d">МС1</text>
<text x="700" y="1183.5" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="400" fill="#16366d">Подбирает сумму, срок и ставку</text>
<text x="700" y="2082" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="400" fill="#475569">Обращение в МС3 всегда отправляет МС2. Ручное рассмотрение не меняет состояние банка.</text>
