<text x="700" y="1367" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="400" fill="#4c1d95">Проверяет предложенный</text>
<text x="700" y="1395" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="400" fill="#4c1d95">кредит на состоянии банка</text>
