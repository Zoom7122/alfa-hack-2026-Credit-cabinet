<text x="215" y="1119.5" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="700" fill="#991b1b">МС1 → клиент</text>
<text x="215" y="1151" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="700" fill="#991b1b">Отклонено</text>
