<text x="700" y="777" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="400" fill="#16366d">Рассчитывает показатели и</text>
<text x="700" y="805" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="400" fill="#16366d">баллы: максимум 1000</text>
