<text x="1080" y="1768" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="700" fill="#4c1d95">МС2 → МС3</text>
<text x="1080" y="1799.5" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="400" fill="#4c1d95">Учитывает выдачу, меняет состояние банка и</text>
<text x="1080" y="1827.5" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="400" fill="#4c1d95">сообщает о кредите</text>
