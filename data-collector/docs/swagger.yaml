        type: string
        x-example: '{"age":42,"marital_status":"MARRIED","children_count":2,"product_code":"WORKING_CAPITAL","requested":{"amount":5000000,"term_months":24},"purpose":{"code":"WORKING_CAPITAL","description":"Закупка
          товара под сезон"},"director":{"inn":"779900010139","last_name":"Ковалёв","first_name":"Игорь","middle_name":"Сергеевич","birth_date":"1984-07-19"},"consents":{"bki_company":{"id":"CNS-2026-000781","signed_at":"2026-10-21T14:02:11Z","valid_until":"2027-04-21"},"bki_person":{"id":"CNS-2026-000782","signed_at":"2026-10-21T14:02:40Z","valid_until":"2027-04-21"},"tax":{"id":"TAX-CNS-2026-000781","signed_at":"2026-10-21T14:03:02Z","valid_until":"2027-04-21","scope":["DECLARATIONS","ENS_BALANCE"]}},"other_bank_biks":["044525225"],"ofd_token":"demo-ofd-token","poa_number":"0f5a2c1e-7b3d-4e8a-9c21-6d4b8e0a1f37","representative_inn":"779900010333"}'
      - collectionFormat: multi
        description: до 10 файлов, считая подписи; документ и его подпись — balance.pdf
          и balance.pdf.sig
        in: formData
        items:
          type: file
        name: files
        type: array
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          headers:
            Location:
              description: /api/v1/collections/{id} — состояние задачи на сбор
              type: string
          schema:
            $ref: '#/definitions/QuestionnaireSubmitted'
        "400":
          description: битый JSON или multipart, нет обязательного поля (age, marital_status,
            children_count) или неверный тип
          schema:
            $ref: '#/definitions/Problem'
        "404":
          description: заявки нет
          schema:
            $ref: '#/definitions/Problem'
        "409":
          description: анкету по заявке уже отправили
          schema:
            $ref: '#/definitions/Problem'
        "413":
          description: запрос больше лимита
          schema:
            $ref: '#/definitions/Problem'
        "415":
          description: не multipart/form-data и не application/json
          schema:
            $ref: '#/definitions/Problem'
        "422":
          description: 'нарушено правило анкеты или файлов: формат, размер, пары подписей,
            больше 10 файлов'
          schema:
            $ref: '#/definitions/Problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Problem'
      security:
      - bearer: []
      summary: 'Отправить анкету: заявка выходит из DRAFT, начинается сбор данных
        из моков'
      tags:
      - questionnaires
  /applications/{id}/signing:
    get:
      description: Сессия сохраняется в БД; после перезагрузки возвращается тот же
        код. У других представителей компании код скрыт.
      parameters:
      - description: id заявки
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/SigningSession'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Problem'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/Problem'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Problem'
      security:
      - bearer: []
      summary: Состояние демо-подписания договора
      tags:
      - signing
  /applications/{id}/signing/confirm:
    post:
      consumes:
      - application/json
      description: Только директор компании или сам ИП. SIGNING → COMPLETED, код стирается.
        Повтор успешного подтверждения безопасен. Неверный код расходует попытку;
        3 ошибки или истечение кода возвращают заявку в OFFERED.
      parameters:
      - description: id заявки
        in: path
        name: id
        required: true
        type: string
      - description: Код из интерфейса
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/ConfirmSigningRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/SigningSession'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Problem'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Problem'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/Problem'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Problem'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/Problem'
        "410":
          description: Gone
          schema:
            $ref: '#/definitions/Problem'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/Problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Problem'
      security:
      - bearer: []
      summary: Подтвердить договор кодом и завершить учебную выдачу
      tags:
      - signing
  /applications/{id}/timeline:
    get:
      description: |-
        События заявки по времени: создание, отправка анкеты, начало и итог сбора данных, проверка подписи.
        Служебные события без текста для клиента не отдаются.
      parameters:
      - description: id заявки (app_…)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Timeline'
        "404":
          description: заявки нет
          schema:
            $ref: '#/definitions/Problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Problem'
      security:
      - bearer: []
      summary: Журнал заявки для клиента
      tags:
      - applications
  /auth/mock-login:
    post:
      consumes:
      - application/json
      description: |-
        Возвращает токен `mock.<user_id>` и пользователя. Токен передаётся в `Authorization: Bearer …`:
        с ним POST /applicants оформляет заявку от имени этого пользователя, а GET /me возвращает его компании.
      parameters:
      - description: id тестового пользователя
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/MockLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/MockLoginResponse'
        "400":
          description: битый JSON, нет user_id
          schema:
            $ref: '#/definitions/Problem'
        "404":
          description: пользователя нет или он не тестовый
          schema:
            $ref: '#/definitions/Problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Problem'
      summary: Войти под синтетическим пользователем
      tags:
      - auth
  /auth/test-users:
    get:
      description: |-
        Тестовые пользователи стенда: директора, бухгалтеры и ИП компаний сценариев mock-api A–E, демо-персонажи
        экранов кабинета и андеррайтер. Заводятся при старте API (SEED_TEST_USERS). Вход — POST /auth/mock-login,
        только под ними: пользователи, заведённые анонимной регистрацией, войти не могут. Токен этой ручке не нужен.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/TestUsers'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Problem'
      summary: Список синтетических пользователей для входа
      tags:
      - auth
  /backoffice/applications:
    get:
      description: |-
        Заявки после отправки анкеты: сначала ручное рассмотрение по сроку, затем остальные — свежие сверху.
        counters — счётчики над очередью (без учёта фильтров). Курсор — смещение следующей страницы.
      parameters:
      - description: статусы через запятую, например MANUAL_REVIEW,WAITING_FOR_INFO
        in: query
        name: status
        type: string
      - description: me — мои, none — без исполнителя, или id андеррайтера
        in: query
        name: assignee
        type: string
      - description: до 100, по умолчанию 50
        in: query
        name: limit
        type: integer
      - description: next_cursor прошлой страницы
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/BoQueue'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Problem'
        "403":
          description: не андеррайтер
          schema:
            $ref: '#/definitions/Problem'
        "422":
          description: неизвестный статус
          schema:
            $ref: '#/definitions/Problem'
      security:
      - bearer: []
      summary: Очередь андеррайтера
      tags:
      - backoffice
  /backoffice/applications/{id}:
    get:
      description: |-
        Заявка с версией (для If-Match решения), исполнителем и сроком, компания по собранным данным,
        итог сбора по системам, находки, скоринг и решение credit-engine, предложения, вопросы клиенту,
        другие заявки компании и журнал со служебными событиями. ETag — версия заявки.
      parameters:
      - description: id заявки (app_…)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/BoDossier'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Problem'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/Problem'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Problem'
      security:
      - bearer: []
      summary: Досье заявки
      tags:
      - backoffice
  /backoffice/applications/{id}/assign:
    post:
      parameters:
      - description: id заявки (app_…)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/BoApplicationListItem'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Problem'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/Problem'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Problem'
        "409":
          description: не на ручном рассмотрении (INVALID_TRANSITION) или уже у другого
            (CONFLICT)
          schema:
            $ref: '#/definitions/Problem'
      security:
      - bearer: []
      summary: Взять заявку в работу
      tags:
      - backoffice
  /backoffice/applications/{id}/decision:
    post:
      consumes:
      - application/json
      description: |-
        APPROVE — предложения клиенту (offers; пусто — условия, предложенные credit-engine), статус OFFERED.
        REJECT — отказ с причинами для клиента (client_reasons), повторно — через 30 дней, статус REJECTED.
        REQUEST_INFO — вопросы клиенту (info_requests), срок ответа 5 дней, статус WAITING_FOR_INFO.
        expert_adjustments и internal_comment — в журнал, клиенту не видны. Заявка без исполнителя
        закрепляется за андеррайтером. Повтор с тем же Idempotency-Key ничего не меняет.
      parameters:
      - description: id заявки (app_…)
        in: path
        name: id
        required: true
        type: string
      - description: версия заявки из досье
        in: header
        name: If-Match
        type: string
      - description: ключ повтора
        in: header
        name: Idempotency-Key
        type: string
      - description: решение
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/BoDecisionInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/BoDossier'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Problem'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Problem'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/Problem'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Problem'
        "409":
          description: не на ручном рассмотрении или у другого андеррайтера
          schema:
            $ref: '#/definitions/Problem'
        "412":
          description: заявка изменилась (If-Match)
          schema:
            $ref: '#/definitions/Problem'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/Problem'
      security:
      - bearer: []
      summary: Решение андеррайтера
      tags:
      - backoffice
  /borrowers/{id}/statements:
    get:
      description: 'Два годовых комплекта из ГИР БО последнего сбора: баланс и ОФР
        в тыс. руб. id — компания (apl_…).'
      parameters:
      - description: id компании (apl_…)
        in: path
        name: id
        required: true
        type: string
      - description: годы через запятую
        in: query
        name: years
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: StatementsResponse credit-engine
          schema:
            type: object
        "404":
          description: по компании не было сбора
          schema:
            $ref: '#/definitions/Problem'
      summary: Бухотчётность компании для credit-engine (поставщик Б)
      tags:
      - credit-engine
  /check-mock:
    get:
      description: |-
        Параллельно опрашивает 5 систем банка (эмулятор mock-api) и возвращает их ответы как есть.
        Секция системы, которая не ответила, — null; причина — в sources.
      parameters:
      - description: 'ИНН: 10 цифр (ЮЛ) или 12 (ИП)'
        example: "7701234567"
        in: query
        name: inn
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/InternalData'
        "400":
          description: не передан inn
          schema:
            $ref: '#/definitions/Problem'
        "422":
          description: inn не из 10 или 12 цифр
          schema:
            $ref: '#/definitions/Problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Problem'
      summary: Проверить данные внутренних систем банка
      tags:
      - internal-data
  /collections/{id}:
    get:
      description: |-
        Задача на сбор, созданная POST /questionnaires. PENDING — ждёт worker, RUNNING — системы опрашиваются,
        COMPLETED — сбор сохранён в raw_collections (строка raw_collection_id), FAILED — не выполнена, причина в error.
        У COMPLETED в sources — состояние по каждой системе: DONE, PARTIAL, FAILED, SKIPPED.
      parameters:
      - description: id задачи (tsk_…)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/CollectionTask'
        "404":
          description: задачи нет
          schema:
            $ref: '#/definitions/Problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Problem'
      security:
      - bearer: []
      summary: Состояние сбора данных по анкете
      tags:
      - collections
  /counterparty/lookup:
    post:
      consumes:
      - application/json
      description: |-
        Синхронный запрос в ЕГРЮЛ/ЕГРИП (эмулятор mock-api) — подсказка на шаге «Компания» до регистрации.
        already_known — компания уже есть в системе (по ней подавали заявку). Нужен токен.
      parameters:
      - description: ИНН
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/CounterpartyLookupRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/CounterpartyPrefill'
        "400":
          description: битый JSON, нет inn
          schema:
            $ref: '#/definitions/Problem'
        "401":
          description: нет или неверный токен
          schema:
            $ref: '#/definitions/Problem'
        "404":
          description: в реестре нет
          schema:
            $ref: '#/definitions/Problem'
        "422":
          description: неверный ИНН
          schema:
            $ref: '#/definitions/Problem'
        "504":
          description: 'реестр не ответил: таймаут, сбой или капча (UPSTREAM_TIMEOUT)'
          schema:
            $ref: '#/definitions/Problem'
      security:
      - bearer: []
      summary: Реквизиты компании по ИНН
      tags:
      - cabinet
  /credit-events:
    post:
      consumes:
      - application/json
      parameters:
      - description: AdminEvent credit-engine
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "202":
          description: EventAck
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Problem'
      summary: 'Событие credit-engine (МС3): выдача, ручное рассмотрение, проблема
        банка'
      tags:
      - credit-engine
  /me:
    get:
      description: 'Пользователь по токену `Authorization: Bearer mock.<user_id>`
        и компании, от имени которых он действует.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Me'
        "401":
          description: нет или неверный токен
          schema:
            $ref: '#/definitions/Problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Problem'
      security:
      - bearer: []
      summary: Текущий пользователь и его компании
      tags:
      - auth
  /products:
    get:
      description: Продукты под задачу и тип заявителя; без фильтров — весь каталог.
        Порядок — от самого подходящего.
      parameters:
      - description: Цель кредита
        enum:
        - WORKING_CAPITAL
        - EQUIPMENT
        - VEHICLE
        - REAL_ESTATE
        - REFINANCING
        - TENDER
        - BUSINESS_EXPANSION
        - OTHER
        in: query
        name: purpose
        type: string
      - description: Тип заявителя
        enum:
        - LEGAL_ENTITY
        - SOLE_PROPRIETOR
        in: query
        name: applicant_type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ProductList'
        "422":
          description: неизвестная цель или тип заявителя
          schema:
            $ref: '#/definitions/Problem'
      summary: Каталог кредитных продуктов
      tags:
      - catalog
  /products/{code}:
    get:
      parameters:
      - description: Код продукта
        example: WORKING_CAPITAL
        in: path
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Product'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Problem'
      summary: Карточка продукта
      tags:
      - catalog
  /products/{code}/calculate:
    post:
      consumes:
      - application/json
      description: Аннуитетный платёж по ставке «от» продукта, без скоринга. Сумма
        и срок — в диапазоне продукта.
      parameters:
      - description: Код продукта
        example: WORKING_CAPITAL
        in: path
        name: code
        required: true
        type: string
      - description: Сумма и срок
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/CalculateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Calculation'
        "400":
          description: некорректное тело
          schema:
            $ref: '#/definitions/Problem'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Problem'
        "422":
          description: сумма или срок вне диапазона продукта
          schema:
            $ref: '#/definitions/Problem'
      summary: Предварительный расчёт платежа
      tags:
      - catalog
securityDefinitions:
  bearer:
    description: Bearer mock.<user_id> из POST /auth/mock-login
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
