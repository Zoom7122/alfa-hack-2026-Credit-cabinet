      parameters:
      - description: id заявки (app_…)
        in: path
        name: id
        required: true
        type: string
      - description: JSON анкеты. Подставлен сценарий A без файлов — для заявки на
          ИНН 7799000012; другие сценарии — в описании
        in: formData
        name: questionnaire
        required: true
        type: string
        x-example: '{"age":42,"marital_status":"MARRIED","children_count":2,"product_code":"WORKING_CAPITAL","requested":{"amount":5000000,"term_months":24},"purpose":{"code":"WORKING_CAPITAL","description":"Закупка
          товара под сезон"},"director":{"inn":"779900010139","last_name":"Ковалёв","first_name":"Игорь","middle_name":"Сергеевич","birth_date":"1984-07-19"},"consents":{"bki_company":{"id":"CNS-2026-000781","signed_at":"2026-10-21T14:02:11Z","valid_until":"2027-04-21"},"bki_person":{"id":"CNS-2026-000782","signed_at":"2026-10-21T14:02:40Z","valid_until":"2027-04-21"},"tax":{"id":"TAX-CNS-2026-000781","signed_at":"2026-10-21T14:03:02Z","valid_until":"2027-04-21","scope":["DECLARATIONS","ENS_BALANCE"]}},"other_bank_biks":["044525225"],"ofd_token":"demo-ofd-token","poa_number":"0f5a2c1e-7b3d-4e8a-9c21-6d4b8e0a1f37","representative_inn":"779900010333"}'
      - collectionFormat: multi
        description: до 10 файлов, считая подписи; документ и его подпись — balance.pdf
          и balance.pdf.sig
        in: formData
        items:
          type: file
        name: files
        type: array
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          headers:
            Location:
              description: /api/v1/collections/{id} — состояние задачи на сбор
              type: string
          schema:
            $ref: '#/definitions/QuestionnaireSubmitted'
        "400":
          description: битый JSON или multipart, нет обязательного поля (age, marital_status,
            children_count) или неверный тип
          schema:
            $ref: '#/definitions/Problem'
        "404":
          description: заявки нет
          schema:
            $ref: '#/definitions/Problem'
        "409":
          description: анкету по заявке уже отправили
          schema:
            $ref: '#/definitions/Problem'
        "413":
          description: запрос больше лимита
          schema:
            $ref: '#/definitions/Problem'
        "415":
          description: не multipart/form-data и не application/json
          schema:
            $ref: '#/definitions/Problem'
        "422":
          description: 'нарушено правило анкеты или файлов: формат, размер, пары подписей,
            больше 10 файлов'
          schema:
            $ref: '#/definitions/Problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Problem'
      security:
      - bearer: []
      summary: 'Отправить анкету: заявка выходит из DRAFT, начинается сбор данных
        из моков'
      tags:
      - questionnaires
  /auth/mock-login:
    post:
      consumes:
      - application/json
      description: |-
        Возвращает токен `mock.<user_id>` и пользователя. Токен передаётся в `Authorization: Bearer …`:
        с ним POST /applicants оформляет заявку от имени этого пользователя, а GET /me возвращает его компании.
      parameters:
      - description: id тестового пользователя
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/MockLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/MockLoginResponse'
        "400":
          description: битый JSON, нет user_id
          schema:
            $ref: '#/definitions/Problem'
        "404":
          description: пользователя нет или он не тестовый
          schema:
            $ref: '#/definitions/Problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Problem'
      summary: Войти под синтетическим пользователем
      tags:
      - auth
  /auth/test-users:
    get:
      description: |-
        Тестовые пользователи стенда: директора, бухгалтеры и ИП компаний сценариев mock-api A–E, демо-персонажи
        экранов кабинета и андеррайтер. Заводятся при старте API (SEED_TEST_USERS). Вход — POST /auth/mock-login,
        только под ними: пользователи, заведённые анонимной регистрацией, войти не могут. Токен этой ручке не нужен.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/TestUsers'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Problem'
      summary: Список синтетических пользователей для входа
      tags:
      - auth
  /check-mock:
    get:
      description: |-
        Параллельно опрашивает 5 систем банка (эмулятор mock-api) и возвращает их ответы как есть.
        Секция системы, которая не ответила, — null; причина — в sources.
      parameters:
      - description: 'ИНН: 10 цифр (ЮЛ) или 12 (ИП)'
        example: "7701234567"
        in: query
        name: inn
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/InternalData'
        "400":
          description: не передан inn
          schema:
            $ref: '#/definitions/Problem'
        "422":
          description: inn не из 10 или 12 цифр
          schema:
            $ref: '#/definitions/Problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Problem'
      summary: Проверить данные внутренних систем банка
      tags:
      - internal-data
  /collections/{id}:
    get:
      description: |-
        Задача на сбор, созданная POST /questionnaires. PENDING — ждёт worker, RUNNING — системы опрашиваются,
        COMPLETED — сбор сохранён в raw_collections (строка raw_collection_id), FAILED — не выполнена, причина в error.
        У COMPLETED в sources — состояние по каждой системе: DONE, PARTIAL, FAILED, SKIPPED.
      parameters:
      - description: id задачи (tsk_…)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/CollectionTask'
        "404":
          description: задачи нет
          schema:
            $ref: '#/definitions/Problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Problem'
      security:
      - bearer: []
      summary: Состояние сбора данных по анкете
      tags:
      - collections
  /me:
    get:
      description: 'Пользователь по токену `Authorization: Bearer mock.<user_id>`
        и компании, от имени которых он действует.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Me'
        "401":
          description: нет или неверный токен
          schema:
            $ref: '#/definitions/Problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Problem'
      security:
      - bearer: []
      summary: Текущий пользователь и его компании
      tags:
      - auth
securityDefinitions:
  bearer:
    description: Bearer mock.<user_id> из POST /auth/mock-login
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
