basePath: /api/v1
definitions:
  Applicant:
    properties:
      already_known:
        description: 'Только в ответе на регистрацию: компания уже была в системе
          и переиспользована.'
        type: boolean
      id:
        example: apl_01JB8Z5X0G6Q9T4V2W8Y3K7M1N
        type: string
      inn:
        example: "7799000012"
        type: string
      name:
        description: До сбора — из регистрации (или «ИНН …»), после — из ЕГРЮЛ.
        example: ООО "СЕВЕРНЫЙ ВЕТЕР"
        type: string
      ogrn:
        example: "1217700412345"
        type: string
      type:
        enum:
        - LEGAL_ENTITY
        - SOLE_PROPRIETOR
        type: string
    type: object
  ApplicantProfile:
    properties:
      applicant_type:
        enum:
        - LEGAL_ENTITY
        - SOLE_PROPRIETOR
        type: string
      can_sign:
        type: boolean
      director_name:
        type: string
      full_name:
        type: string
      id:
        example: apl_north_wind
        type: string
      inn:
        example: "7799000012"
        type: string
      kpp:
        type: string
      my_role:
        enum:
        - OWNER
        - DIRECTOR
        - CFO
        - ACCOUNTANT
        - FINANCE_EMPLOYEE
        - BANKING_EMPLOYEE
        - AUTHORIZED_EMPLOYEE
        type: string
      ogrn:
        example: "1217700412345"
        type: string
      region:
        type: string
      registration_date:
        example: "2021-03-14"
        type: string
      registry_status:
        description: ACTIVE или LIQUIDATED (в выписке есть дата прекращения). Нет
          — реквизиты ещё не собирали.
        enum:
        - ACTIVE
        - LIQUIDATED
        type: string
      short_name:
        example: ООО "СЕВЕРНЫЙ ВЕТЕР"
        type: string
    required:
    - applicant_type
    - can_sign
    - id
    - inn
    - my_role
    - short_name
    type: object
  Applicants:
    properties:
      items:
        items:
          $ref: '#/definitions/ApplicantProfile'
        type: array
    required:
    - items
    type: object
  Application:
    properties:
      applicant:
        $ref: '#/definitions/Applicant'
      collection_task_id:
        description: 'Последняя задача на сбор: GET /collections/{id}.'
        example: tsk_01JB8Z5X0G6Q9T4V2W8Y3K7M1N
        type: string
      created_at:
        type: string
      documents:
        items:
          $ref: '#/definitions/Document'
        type: array
      id:
        example: app_01JB8Z5X0G6Q9T4V2W8Y3K7M1N
        type: string
      number:
        example: A-2026-000001
        type: string
      product_code:
        example: WORKING_CAPITAL
        type: string
      purpose:
        $ref: '#/definitions/Purpose'
      representative:
        $ref: '#/definitions/Representative'
      requested:
        $ref: '#/definitions/RequestedTerms'
      status:
        description: |-
          DRAFT — создана при регистрации, SUBMITTED — анкета отправлена, ENRICHING — идёт сбор данных,
          VERIFYING — данные собраны, ждём проверку подписей, SCORING — оценивает credit-engine,
          MANUAL_REVIEW — у андеррайтера, WAITING_FOR_INFO — банк ждёт ответов клиента,
          OFFERED — выдано предложение, REJECTED — отказ.
        enum:
        - DRAFT
        - SUBMITTED
        - ENRICHING
        - VERIFYING
        - SCORING
        - MANUAL_REVIEW
        - WAITING_FOR_INFO
        - OFFERED
        - REJECTED
        - SIGNING
        - COMPLETED
        example: DRAFT
        type: string
      submitted_at:
        type: string
      updated_at:
        type: string
    type: object
  ApplicationDraft:
    properties:
      data:
        type: object
      updated_at:
        type: string
      version:
        type: integer
    type: object
  Applications:
    properties:
      items:
        items:
          $ref: '#/definitions/Application'
        type: array
    required:
    - items
    type: object
  BoApplicant:
    properties:
      bank_relationship:
        additionalProperties: {}
        type: object
      credit_history:
        additionalProperties: {}
        type: object
      director_name:
        type: string
      enforcement:
        additionalProperties: {}
        type: object
      financial_statements:
        items:
          $ref: '#/definitions/decision.YearFigures'
        type: array
      full_name:
        type: string
      id:
        type: string
      inn:
        type: string
      kpp:
        type: string
      litigation:
        additionalProperties: {}
        type: object
      ogrn:
        type: string
      okved:
        type: string
      region:
        type: string
      registration_date:
        type: string
      risk_flags:
        items:
          type: string
        type: array
      short_name:
        type: string
      terminated_on:
        type: string
      type:
        type: string
    type: object
  BoApplicantRef:
    properties:
      id:
        type: string
      inn:
        type: string
      short_name:
        type: string
      type:
        enum:
        - LEGAL_ENTITY
        - SOLE_PROPRIETOR
        type: string
    type: object
  BoApplicationListItem:
    properties:
      applicant:
        $ref: '#/definitions/BoApplicantRef'
      assignee:
        $ref: '#/definitions/UserRef'
      degraded_sources:
        description: системы, ответившие с ошибкой или частично
        items:
          type: string
        type: array
      grade:
        enum:
        - A
        - B
        - C
        - D
        type: string
      id:
        type: string
      manual_review_reasons:
        description: Причины ручного рассмотрения от credit-engine — только у MANUAL_REVIEW.
        items:
          type: string
        type: array
      number:
        type: string
      product_code:
        type: string
      requested:
        $ref: '#/definitions/RequestedTerms'
      score:
        type: integer
      sla_due_at:
        type: string
      status:
        type: string
      submitted_at:
        type: string
      version:
        type: integer
    type: object
  BoDecisionInput:
    properties:
      action:
        enum:
        - APPROVE
        - REJECT
        - REQUEST_INFO
        type: string
      client_reasons:
        items:
          $ref: '#/definitions/ClientReason'
        type: array
      expert_adjustments:
        items:
          $ref: '#/definitions/ExpertAdjustment'
        type: array
      info_requests:
        items:
          $ref: '#/definitions/InfoRequestInput'
        type: array
      internal_comment:
        type: string
      offers:
        items:
          $ref: '#/definitions/OfferInput'
        type: array
    required:
    - action
    type: object
  BoDossier:
    properties:
      applicant:
        $ref: '#/definitions/BoApplicant'
      application:
        $ref: '#/definitions/Application'
      assignee:
        $ref: '#/definitions/UserRef'
      engine_decision:
        $ref: '#/definitions/BoEngineDecision'
      findings:
        items:
          $ref: '#/definitions/BoFinding'
        type: array
      info_requests:
        items:
          $ref: '#/definitions/InfoRequest'
        type: array
      offers:
        items:
          $ref: '#/definitions/Offer'
        type: array
      other_applications:
        items:
          $ref: '#/definitions/BoApplicationListItem'
        type: array
      score:
        $ref: '#/definitions/BoScore'
      sla_due_at:
        type: string
      sources:
        items:
          $ref: '#/definitions/BoSource'
        type: array
      timeline:
        items:
          $ref: '#/definitions/BoTimelineEvent'
        type: array
      underwriter_decision:
        $ref: '#/definitions/BoUnderwriterDecision'
      version:
        description: для If-Match решения
        type: integer
    type: object
  BoEngineDecision:
    properties:
      engine_status:
        enum:
        - APPROVED
        - REJECTED
        - UNDER_REVIEW
        - NEED_INFO
        type: string
      outcome:
        description: 'Итог движка для заявки: APPROVED, REJECTED, MANUAL_REVIEW, NEED_INFO.'
        type: string
      proposed_terms:
        $ref: '#/definitions/BoTerms'
      reasons:
        items:
          $ref: '#/definitions/BoEngineReason'
        type: array
      review_reason:
        enum:
        - BORROWER
        - BANK
        type: string
    type: object
  BoEngineReason:
    properties:
      code:
        type: string
      fields:
        items:
          type: string
        type: array
      message:
        type: string
    type: object
  BoFinding:
    properties:
      code:
        type: string
      declared_value:
        type: string
      found_value:
        type: string
      material:
        type: boolean
      message:
        type: string
      severity:
        enum:
        - INFO
        - WARN
        - STOP
        type: string
      source:
        type: string
    type: object
  BoQueue:
    properties:
      counters:
        $ref: '#/definitions/BoQueueCounters'
      items:
        items:
          $ref: '#/definitions/BoApplicationListItem'
        type: array
      next_cursor:
        description: Курсор следующей страницы; null — страниц больше нет.
        type: string
    type: object
  BoQueueCounters:
    properties:
      due_today:
        type: integer
      manual_review:
        type: integer
      mine:
        type: integer
      waiting_for_info:
        type: integer
    type: object
  BoScore:
    properties:
      computed_at:
        type: string
      engine:
        enum:
        - SCORECARD
        type: string
      factors:
        items:
          $ref: '#/definitions/BoScoreFactor'
        type: array
      grade:
        enum:
        - A
        - B
        - C
        - D
        type: string
      model_version:
        type: string
      raw_total:
        type: number
      total:
        type: integer
    type: object
  BoScoreFactor:
    properties:
      answer:
        type: string
      code:
        type: string
      max_points:
        type: integer
      part:
        enum:
        - QUESTIONNAIRE
        - ECONOMICS
        type: string
      points:
        type: number
      title:
        type: string
      value:
        type: number
    type: object
  BoSource:
    properties:
      calls:
        type: integer
      code:
        description: 'система data-collector: CORE_BANKING, FNS, BKI, …'
        type: string
      criticality:
        enum:
        - CRITICAL
        - NORMAL
        type: string
      duration_ms:
        type: integer
      failed_calls:
        type: integer
      fetched_at:
        type: string
      reason:
        type: string
      state:
        enum:
        - DONE
        - PARTIAL
        - FAILED
        - SKIPPED
        type: string
    type: object
  BoTerms:
    properties:
      amount:
        type: integer
      confirmed:
        description: условия подтверждены движком и банком (APPROVED)
        type: boolean
      monthly_payment:
        type: integer
      rate_annual:
        type: number
      term_months:
        type: integer
    type: object
  BoTimelineEvent:
    properties:
      actor:
        allOf:
        - $ref: '#/definitions/UserRef'
        description: сотрудник банка
      actor_kind:
        enum:
        - CLIENT
        - SYSTEM
        - EMPLOYEE
        type: string
      at:
        type: string
      from_status:
        type: string
      id:
        type: string
      internal:
        description: 'служебное: клиенту не показывается'
        type: boolean
      message:
        example: Данные о компании собраны
        type: string
      to_status:
        type: string
      type:
        description: |-
          Тип события модуля: application.created, application.submitted, enrich.started, enrich.completed, enrich.failed,
          document.signatures_verified.
        example: enrich.completed
        type: string
    required:
    - actor_kind
    - at
    - id
    - message
    - type
    type: object
  BoUnderwriterDecision:
    properties:
      comment:
        type: string
      decided_at:
        type: string
      decided_by:
        $ref: '#/definitions/UserRef'
      outcome:
        enum:
        - APPROVED
        - APPROVED_WITH_CHANGES
        - REJECTED
        - NEED_INFO
        type: string
    type: object
  CalculateRequest:
    properties:
      amount:
        example: 5000000
        type: integer
      term_months:
        example: 24
        type: integer
    required:
    - amount
    - term_months
    type: object
  Calculation:
    properties:
      disclaimer:
        type: string
      monthly_payment_from:
        example: 251234
        type: integer
      rate_annual_from:
        example: 18.5
        type: number
    type: object
  ClientDecision:
    properties:
      decided_at:
        type: string
      decided_by:
        enum:
        - ENGINE
        - EMPLOYEE
        type: string
      outcome:
        enum:
        - APPROVED
        - APPROVED_WITH_CHANGES
        - REJECTED
        - MANUAL_REVIEW
        - NEED_INFO
        type: string
      reapply_after:
        description: когда можно подать заявку снова
        type: string
      reasons:
        description: Причины отказа для клиента — без баллов и внутренних проверок.
        items:
          $ref: '#/definitions/domain.ClientReason'
        type: array
    type: object
  ClientReason:
    properties:
      code:
        type: string
      description:
        type: string
      title:
        type: string
    type: object
  CollectionSource:
    properties:
      calls:
        type: integer
      duration_ms:
        type: integer
      failed_calls:
        type: integer
      reason:
        type: string
      source:
        enum:
        - CORE_BANKING
        - FNS
        - BKI
        - COMPLIANCE
        - FSSP
        - KAD
        - FEDRESURS
        - M4D
        - TAX_REPORTS
        - PLEDGE_REGISTRY
        - EGRN
        - GOSUSLUGI
        - OPEN_BANKING
        - MARKETPLACES
        - OFD
        - ZAKUPKI
        - SIGNALS
        - CBR
        - HH
        type: string
      state:
        enum:
        - DONE
        - PARTIAL
        - FAILED
        - SKIPPED
        type: string
    type: object
  CollectionTask:
    properties:
      application_id:
        example: app_01JB8Z5X0G6Q9T4V2W8Y3K7M1N
        type: string
      attempts:
        description: сколько раз worker брал задачу
        example: 0
        type: integer
      created_at:
        type: string
      document_ids:
        description: Документы, пришедшие с анкетой.
        items:
          type: string
        type: array
      error:
        description: почему FAILED
        type: string
      finished_at:
        type: string
      id:
        example: tsk_01JB8Z5X0G6Q9T4V2W8Y3K7M1N
        type: string
      inn:
        example: "7799000012"
        type: string
      questionnaire_id:
        example: qst_01JB8Z5X0G6Q9T4V2W8Y3K7M1N
        type: string
      raw_collection_id:
        example: col_01JB8Z5X0G6Q9T4V2W8Y3K7M1N
        type: string
      skipped_sources:
        description: 'Системы, для которых в анкете нет данных (согласия, токена,
          залога, банков): они не опрашиваются.'
        example:
        - EGRN
        - MARKETPLACES
        items:
          type: string
        type: array
      sources:
        description: 'только у COMPLETED: состояние по каждой системе'
        items:
          $ref: '#/definitions/CollectionSource'
        type: array
      started_at:
        type: string
      status:
        description: PENDING — ждёт worker, RUNNING — системы опрашиваются, COMPLETED
          — сбор сохранён, FAILED — не выполнена.
        enum:
        - PENDING
        - RUNNING
        - COMPLETED
        - FAILED
        example: PENDING
        type: string
    type: object
  CompanyAccess:
    properties:
      applicant_id:
        example: apl_north_wind
        type: string
      can_sign:
        description: 'Может подписать договор без доверенности: директор, у ИП — сам
          предприниматель.'
        type: boolean
      inn:
        example: "7799000012"
        type: string
      role:
        enum:
        - OWNER
        - DIRECTOR
        - CFO
        - ACCOUNTANT
        - FINANCE_EMPLOYEE
        - BANKING_EMPLOYEE
        - AUTHORIZED_EMPLOYEE
        example: DIRECTOR
        type: string
      short_name:
        example: ООО «Северный ветер»
        type: string
    required:
    - applicant_id
    - can_sign
    - inn
    - role
    - short_name
    type: object
  CompanyInput:
    properties:
      inn:
        description: 10 цифр — ЮЛ, 12 — ИП
        example: "7799000012"
        type: string
      name:
        description: Название, если известно. После сбора данных заменится названием
          из ЕГРЮЛ.
        example: ООО «Северный ветер»
        type: string
    required:
    - inn
    type: object
  ConfirmSigningRequest:
    properties:
      code:
        example: "123456"
        type: string
      method:
        enum:
        - SIMPLE_CODE
        type: string
    required:
    - code
    type: object
  CounterpartyLookupRequest:
    properties:
      inn:
        example: "7799000012"
        type: string
    required:
    - inn
    type: object
  CounterpartyPrefill:
    properties:
      already_known:
        description: 'Компания уже есть в системе: по ней подавали заявку.'
        type: boolean
      applicant_type:
        enum:
        - LEGAL_ENTITY
        - SOLE_PROPRIETOR
        type: string
      director_name:
        example: Ковалёв Игорь Сергеевич
        type: string
      full_name:
        type: string
      inn:
        example: "7799000012"
        type: string
      kpp:
        type: string
      ogrn:
        example: "1217700412345"
        type: string
      region:
        type: string
      registration_date:
        example: "2021-03-14"
        type: string
      registry_status:
        enum:
        - ACTIVE
        - LIQUIDATED
        type: string
      short_name:
        example: ООО "СЕВЕРНЫЙ ВЕТЕР"
        type: string
    required:
    - already_known
    - applicant_type
    - full_name
    - inn
    - registry_status
    - short_name
    type: object
  Document:
    properties:
      file_name:
        example: balance.pdf
        type: string
      id:
        example: doc_01JB8Z5X0G6Q9T4V2W8Y3K7M1N
        type: string
      info_request_id:
        type: string
      mime_type:
        example: application/pdf
        type: string
      recognition_state:
        enum:
        - NOT_APPLICABLE
        - PENDING
        - PROCESSING
        - DONE
        - FAILED
        type: string
      sha256:
        type: string
      signature_state:
        enum:
        - NOT_SIGNED
        - PENDING
        - DONE
        - FAILED
        type: string
      signature_verdict:
        description: Итог проверки подписи (после DONE или FAILED); нет — подпись
          не проверяли.
        enum:
        - VALID
        - VALID_WITH_WARNINGS
        - INVALID
        - INDETERMINATE
        type: string
      signed_document_id:
        description: У открепленной подписи (type=SIGNATURE) — какой документ она
          подписывает.
        type: string
      size_bytes:
        example: 48213
        type: integer
      type:
        example: FINANCIAL_STATEMENTS
        type: string
      uploaded_at:
        type: string
    type: object
  ExpertAdjustment:
    properties:
      code:
        type: string
      comment:
        type: string
      points:
        type: integer
    type: object
  InfoRequest:
    properties:
      answer:
        type: object
      answered_at:
        type: string
      created_at:
        type: string
      description:
        type: string
      documents:
        type: object
      due_at:
        type: string
      id:
        type: string
      input:
        type: object
      required:
        type: boolean
      source:
        enum:
        - credit-engine
        - underwriter
        type: string
      state:
        enum:
        - OPEN
        - ANSWERED
        - CANCELLED
        type: string
      target_field:
        type: string
      title:
        type: string
    type: object
  InfoRequestAnswerInput:
    properties:
      comment:
        type: string
      document_ids:
        items:
          type: string
        type: array
      value:
        description: 'Значение по input.type вопроса: число (NUMBER, MONEY), код варианта
          (CHOICE), строка (TEXT). NONE — не нужно.'
        type: string
    type: object
  InfoRequestAnswered:
    properties:
      info_requests:
        items:
          $ref: '#/definitions/InfoRequest'
        type: array
      status:
        description: |-
          Статус заявки после ответа: WAITING_FOR_INFO — есть ещё вопросы; VERIFYING — повторная оценка;
          MANUAL_REVIEW — вопросы задал специалист, заявка вернулась к нему.
        type: string
    type: object
  InfoRequestInput:
    properties:
      description:
        type: string
      documents:
        type: object
      input:
        type: object
      required:
        type: boolean
      target_field:
        type: string
      title:
        type: string
    type: object
  InfoRequests:
    properties:
      items:
        items:
          $ref: '#/definitions/InfoRequest'
        type: array
    type: object
  InternalData:
    properties:
      accounts:
        $ref: '#/definitions/domain.AccountsReport'
      acquiring:
        $ref: '#/definitions/domain.AcquiringReport'
      card_index:
        $ref: '#/definitions/domain.CardIndexReport'
      credits:
        $ref: '#/definitions/domain.CreditReport'
      inn:
        type: string
      salary_project:
        $ref: '#/definitions/domain.SalaryProjectReport'
      sources:
        items:
          $ref: '#/definitions/SourceResult'
        type: array
    type: object
  Me:
    properties:
      companies:
        items:
          $ref: '#/definitions/CompanyAccess'
        type: array
      full_name:
        example: Ковалёв Игорь Сергеевич
        type: string
      id:
        example: usr_director_north
        type: string
      pending_signatures:
        description: Заявки, ждущие демо-подписи директора или самого ИП.
        items:
          type: string
        type: array
      roles:
        items:
          enum:
          - CLIENT
          - UNDERWRITER
          type: string
        type: array
    required:
    - companies
    - full_name
    - id
    - pending_signatures
    - roles
    type: object
  MockLoginRequest:
    properties:
