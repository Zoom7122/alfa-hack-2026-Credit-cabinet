info:
  contact: {}
  description: |-
    Сбор данных о заёмщике для скоринга: заявитель и компания, анкета с документами и сырые ответы
    всех внешних систем (эмулятор mock-api). Сначала регистрация (POST /applicants → черновик заявки),
    затем анкета с файлами (POST /applications/{id}/questionnaire). Сбор асинхронный: анкета ставит
    задачу в очередь (outbox → Kafka), системы опрашивает worker.
    Вход — мок-логином, как в api/openapi.yaml: GET /auth/test-users → POST /auth/mock-login → токен
    `mock.<user_id>` в `Authorization: Bearer …`. С токеном регистрация идёт от имени пользователя; без него — анонимно.
    Ошибки — RFC 9457 (`application/problem+json`).
  title: data-collector API
  version: "0.2"
paths:
  /applicants:
    post:
      consumes:
      - application/json
      description: |
        Одной транзакцией создаёт пользователя (с тем же ИНН физлица — находит существующего), компанию
        (с тем же ИНН — переиспользует вместе с собранными данными), связь с ролью в company_members
        и черновик заявки (DRAFT). Если у этого пользователя по этой компании уже есть черновик, возвращается он.
        Подписывать договор без доверенности может директор, у ИП — сам предприниматель (can_sign).
        Дальше — анкета: POST /applications/{id}/questionnaire выводит заявку из DRAFT и запускает сбор данных.
        С токеном `Authorization: Bearer mock.<user_id>` (POST /auth/mock-login) заявка оформляется от имени вошедшего
        пользователя: нового пользователя не заводится, ФИО берётся из профиля (поле в теле всё равно обязательно),
        `representative.inn` не нужен, черновик по компании — его. Уже записанная роль в компании не меняется.
        Сотрудник банка (UNDERWRITER) заявку подать не может — 403.

        **Примеры** — заявители сценариев mock-api A–E (`examples/scenario-X.applicant.json`), в теле по умолчанию — сценарий A. Данные в моках привязаны к компании, поэтому анкету берите того же сценария: они в описании POST /applications/{id}/questionnaire.

        **A** — ООО «Северный ветер», ИНН 7799000012, опт продуктов — ожидается OFFERED.

        ```json
        {
          "representative": {
            "full_name": "Литвинова Марина Олеговна",
            "inn": "779900010333",
            "role": "ACCOUNTANT"
          },
          "company": {
            "inn": "7799000012",
            "name": "ООО «Северный ветер»"
          }
        }
        ```

        **B** — ООО «Стройресурс», ИНН 7799000020, стройка — OFFERED, но меньше сумма или дольше срок.

        ```json
        {
          "representative": {
            "full_name": "Орлов Денис Павлович",
