basePath: /api/v1
definitions:
  Applicant:
    properties:
      already_known:
        description: 'Только в ответе на регистрацию: компания уже была в системе
          и переиспользована.'
        type: boolean
      id:
        example: apl_01JB8Z5X0G6Q9T4V2W8Y3K7M1N
        type: string
      inn:
        example: "7799000012"
        type: string
      name:
        description: До сбора — из регистрации (или «ИНН …»), после — из ЕГРЮЛ.
        example: ООО "СЕВЕРНЫЙ ВЕТЕР"
        type: string
      ogrn:
        example: "1217700412345"
        type: string
      type:
        enum:
        - LEGAL_ENTITY
        - SOLE_PROPRIETOR
        type: string
    type: object
  Application:
    properties:
      applicant:
        $ref: '#/definitions/Applicant'
      collection_task_id:
        description: 'Последняя задача на сбор: GET /collections/{id}.'
        example: tsk_01JB8Z5X0G6Q9T4V2W8Y3K7M1N
        type: string
      created_at:
        type: string
      documents:
        items:
          $ref: '#/definitions/Document'
        type: array
      id:
        example: app_01JB8Z5X0G6Q9T4V2W8Y3K7M1N
        type: string
      number:
        example: A-2026-000001
        type: string
      product_code:
        example: WORKING_CAPITAL
        type: string
      purpose:
        $ref: '#/definitions/Purpose'
      representative:
        $ref: '#/definitions/Representative'
      requested:
        $ref: '#/definitions/RequestedTerms'
      status:
        description: |-
          DRAFT — создана при регистрации, SUBMITTED — анкета отправлена, ENRICHING — идёт сбор данных,
          VERIFYING — данные собраны.
        enum:
        - DRAFT
        - SUBMITTED
        - ENRICHING
        - VERIFYING
        example: DRAFT
        type: string
      submitted_at:
        type: string
      updated_at:
        type: string
    type: object
  CollectionSource:
    properties:
      calls:
        type: integer
      duration_ms:
        type: integer
      failed_calls:
        type: integer
      reason:
        type: string
      source:
        enum:
        - CORE_BANKING
        - FNS
        - BKI
        - COMPLIANCE
        - FSSP
        - KAD
        - FEDRESURS
        - M4D
        - TAX_REPORTS
        - PLEDGE_REGISTRY
        - EGRN
        - GOSUSLUGI
        - OPEN_BANKING
        - MARKETPLACES
        - OFD
        - ZAKUPKI
        - SIGNALS
        - CBR
        - HH
        type: string
      state:
        enum:
        - DONE
        - PARTIAL
        - FAILED
        - SKIPPED
        type: string
    type: object
  CollectionTask:
    properties:
      application_id:
        example: app_01JB8Z5X0G6Q9T4V2W8Y3K7M1N
        type: string
      attempts:
        description: сколько раз worker брал задачу
        example: 0
        type: integer
      created_at:
        type: string
      document_ids:
        description: Документы, пришедшие с анкетой.
        items:
          type: string
        type: array
      error:
        description: почему FAILED
        type: string
      finished_at:
        type: string
      id:
        example: tsk_01JB8Z5X0G6Q9T4V2W8Y3K7M1N
        type: string
      inn:
        example: "7799000012"
        type: string
      questionnaire_id:
        example: qst_01JB8Z5X0G6Q9T4V2W8Y3K7M1N
        type: string
      raw_collection_id:
        example: col_01JB8Z5X0G6Q9T4V2W8Y3K7M1N
        type: string
      skipped_sources:
        description: 'Системы, для которых в анкете нет данных (согласия, токена,
          залога, банков): они не опрашиваются.'
        example:
        - EGRN
        - MARKETPLACES
        items:
          type: string
        type: array
      sources:
        description: 'только у COMPLETED: состояние по каждой системе'
        items:
          $ref: '#/definitions/CollectionSource'
        type: array
      started_at:
        type: string
      status:
        description: PENDING — ждёт worker, RUNNING — системы опрашиваются, COMPLETED
          — сбор сохранён, FAILED — не выполнена.
        enum:
        - PENDING
        - RUNNING
        - COMPLETED
        - FAILED
        example: PENDING
        type: string
    type: object
  CompanyAccess:
