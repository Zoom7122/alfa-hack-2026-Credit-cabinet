# Generated from backend Swagger by npm run gen:openapi. See docs/api.md.
openapi: 3.0.3
info:
  description: |-
    Действующий backend кредитного кабинета: вход, компании, каталог, черновики и анкеты,
    сбор данных через outbox/Kafka, документы и подписи TEST, результаты скоринга, вопросы банка,
    предложения, демо-подписание кодом и рабочее место андеррайтера. Внешние системы — локальный mock-api.
    GET /auth/test-users → POST /auth/mock-login → Authorization: Bearer mock.<user_id>.
    Регистрация допускает анонимный режим; черновики и изменения заявки проверяют её автора.
    Служебные /borrowers/{id}/statements, /credit-events и /check-mock доступны напрямую на 8081,
    но не через nginx кабинета. WebSocket, PATCH заявки и КЭП договора backend не реализует.
    Большинство ошибок — RFC 9457 (application/problem+json); ошибки multipart загрузки документов
    могут содержать только code. Версия черновика передаётся в JSON, не в If-Match.
    OpenAPI 3: api/openapi.yaml; справочник и ограничения: docs/api.md.
  title: Credit Cabinet Backend / data-collector API
  contact: {}
  version: "0.2"
paths:
  /applicants:
    get:
      security:
        - bearer: []
      description: >-
        Компании, от имени которых действует вошедший пользователь, с его ролью и реквизитами из ЕГРЮЛ

        (после сбора данных; до него — только ИНН и название). Первая — основная (заведённая тестовому
        пользователю).
      tags:
        - cabinet
      summary: Компании текущего пользователя
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Applicants"
        "401":
          description: нет или неверный токен
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      operationId: getApplicants
    post:
      security:
        - {}
        - bearer: []
      description: >
        Одной транзакцией создаёт пользователя (с тем же ИНН физлица — находит существующего), компанию

        (с тем же ИНН — переиспользует вместе с собранными данными), связь с ролью в company_members

        и черновик заявки (DRAFT). Если у этого пользователя по этой компании уже есть черновик, возвращается
        он.

        Подписывать договор без доверенности может директор, у ИП — сам предприниматель (can_sign).

        Дальше — анкета: POST /applications/{id}/questionnaire выводит заявку из DRAFT и запускает сбор
        данных.

        С токеном `Authorization: Bearer mock.<user_id>` (POST /auth/mock-login) заявка оформляется от имени
        вошедшего

        пользователя: нового пользователя не заводится, ФИО берётся из профиля (поле в теле всё равно
        обязательно),

        `representative.inn` не нужен, черновик по компании — его. Уже записанная роль в компании не меняется.

        Сотрудник банка (UNDERWRITER) заявку подать не может — 403.


        **Примеры** — заявители сценариев mock-api A–E (`examples/scenario-X.applicant.json`), в теле по
        умолчанию — сценарий A. Данные в моках привязаны к компании, поэтому анкету берите того же сценария:
        они в описании POST /applications/{id}/questionnaire.


        **A** — ООО «Северный ветер», ИНН 7799000012, опт продуктов — ожидается OFFERED.


        ```json

        {
          "representative": {
            "full_name": "Литвинова Марина Олеговна",
            "inn": "779900010333",
            "role": "ACCOUNTANT"
          },
          "company": {
            "inn": "7799000012",
            "name": "ООО «Северный ветер»"
          }
        }

        ```


        **B** — ООО «Стройресурс», ИНН 7799000020, стройка — OFFERED, но меньше сумма или дольше срок.


        ```json

        {
          "representative": {
            "full_name": "Орлов Денис Павлович",
            "inn": "779900020136",
            "role": "DIRECTOR"
          },
          "company": {
            "inn": "7799000020",
            "name": "ООО «Стройресурс»"
          }
        }

        ```


        **C** — ООО «Альтаир», ИНН 7799000037, опт — REJECTED.


        ```json

        {
          "representative": {
            "full_name": "Белов Артём Николаевич",
            "inn": "779900030147",
            "role": "DIRECTOR"
          },
          "company": {
            "inn": "7799000037"
          }
        }

        ```


        **D** — ИП Смирнова А. В., ИНН 779900010202, интернет-торговля — WAITING_FOR_INFO.


        ```json

        {
          "representative": {
            "full_name": "Смирнова Анна Викторовна",
            "inn": "779900010202",
            "role": "OWNER"
          },
          "company": {
            "inn": "779900010202"
          }
        }

        ```


        **E** — ООО «Техно-Сервис», ИНН 7799000044, ремонт оборудования — MANUAL_REVIEW.


        ```json

        {
          "representative": {
            "full_name": "Кузнецов Павел Андреевич",
            "role": "FINANCE_EMPLOYEE"
          },
          "company": {
            "inn": "7799000044",
            "name": "ООО «Техно-Сервис»"
          }
        }

        ```
      tags:
        - applicants
      summary: "Зарегистрировать заявителя: кто оформляет кредит и за какую компанию"
