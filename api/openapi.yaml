              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Неверный переданный токен либо вход обязателен для этой заявки
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      operationId: postCreditEvents
      security:
        - {}
        - bearer: []
      servers:
        - url: http://localhost:8081/api/v1
          description: Backend напрямую; порт DATA_COLLECTOR_PORT
  /me:
    get:
      security:
        - bearer: []
      description: "Пользователь по токену `Authorization: Bearer mock.<user_id>` и компании, от имени которых он
        действует."
      tags:
        - auth
      summary: Текущий пользователь и его компании
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          description: нет или неверный токен
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      operationId: getMe
  /products:
    get:
      description: Продукты под задачу и тип заявителя; без фильтров — весь каталог. Порядок — от самого подходящего.
      tags:
        - catalog
      summary: Каталог кредитных продуктов
      parameters:
        - description: Цель кредита
          name: purpose
          in: query
          schema:
            type: string
            enum:
              - WORKING_CAPITAL
              - EQUIPMENT
              - VEHICLE
              - REAL_ESTATE
              - REFINANCING
              - TENDER
              - BUSINESS_EXPANSION
              - OTHER
        - description: Тип заявителя
          name: applicant_type
          in: query
          schema:
            type: string
            enum:
              - LEGAL_ENTITY
              - SOLE_PROPRIETOR
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductList"
        "401":
          description: Неверный переданный токен либо вход обязателен для этой заявки
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: неизвестная цель или тип заявителя
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      operationId: getProducts
      security:
        - {}
        - bearer: []
  /products/{code}:
    get:
      tags:
        - catalog
      summary: Карточка продукта
      parameters:
        - example: WORKING_CAPITAL
          description: Код продукта
          name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "401":
          description: Неверный переданный токен либо вход обязателен для этой заявки
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      operationId: getProductsCode
      security:
        - {}
        - bearer: []
  /products/{code}/calculate:
    post:
      description: Аннуитетный платёж по ставке «от» продукта, без скоринга. Сумма и срок — в диапазоне продукта.
      tags:
        - catalog
      summary: Предварительный расчёт платежа
      parameters:
        - example: WORKING_CAPITAL
          description: Код продукта
          name: code
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalculateRequest"
        description: Сумма и срок
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Calculation"
        "400":
          description: некорректное тело
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Неверный переданный токен либо вход обязателен для этой заявки
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: сумма или срок вне диапазона продукта
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      operationId: postProductsCodeCalculate
      security:
        - {}
        - bearer: []
  /healthz:
    get:
      operationId: getHealthz
      summary: Процесс HTTP API работает
      tags:
        - health
      security: []
      servers:
        - url: http://localhost:8081
      responses:
        "200":
          description: Процесс доступен; не проверяет готовность всего конвейера
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - ok
servers:
  - url: http://localhost:8081/api/v1
    description: Backend напрямую; порт DATA_COLLECTOR_PORT
  - url: http://localhost:3000/collector/api/v1
    description: Через frontend nginx; только разрешённые клиентские маршруты
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: mock.<user_id>
  schemas:
    Applicant:
      type: object
      properties:
        already_known:
          description: "Только в ответе на регистрацию: компания уже была в системе и переиспользована."
          type: boolean
        id:
          type: string
          example: apl_01JB8Z5X0G6Q9T4V2W8Y3K7M1N
        inn:
          type: string
          example: "7799000012"
        name:
          description: До сбора — из регистрации (или «ИНН …»), после — из ЕГРЮЛ.
          type: string
          example: ООО "СЕВЕРНЫЙ ВЕТЕР"
        ogrn:
          type: string
          example: "1217700412345"
        type:
          type: string
          enum:
            - LEGAL_ENTITY
            - SOLE_PROPRIETOR
    ApplicantProfile:
      type: object
      required:
        - applicant_type
        - can_sign
        - id
        - inn
        - my_role
        - short_name
      properties:
        applicant_type:
          type: string
          enum:
            - LEGAL_ENTITY
            - SOLE_PROPRIETOR
        can_sign:
          type: boolean
        director_name:
          type: string
        full_name:
          type: string
        id:
          type: string
          example: apl_north_wind
        inn:
          type: string
          example: "7799000012"
        kpp:
          type: string
        my_role:
          type: string
          enum:
            - OWNER
            - DIRECTOR
            - CFO
            - ACCOUNTANT
            - FINANCE_EMPLOYEE
            - BANKING_EMPLOYEE
            - AUTHORIZED_EMPLOYEE
        ogrn:
          type: string
          example: "1217700412345"
        region:
          type: string
        registration_date:
          type: string
          example: 2021-03-14
        registry_status:
          description: ACTIVE или LIQUIDATED (в выписке есть дата прекращения). Нет — реквизиты ещё не собирали.
          type: string
          enum:
            - ACTIVE
            - LIQUIDATED
        short_name:
          type: string
          example: ООО "СЕВЕРНЫЙ ВЕТЕР"
    Applicants:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ApplicantProfile"
    Application:
      type: object
      properties:
        applicant:
          $ref: "#/components/schemas/Applicant"
        collection_task_id:
          description: "Последняя задача на сбор: GET /collections/{id}."
          type: string
          example: tsk_01JB8Z5X0G6Q9T4V2W8Y3K7M1N
        created_at:
          type: string
        documents:
          type: array
          items:
            $ref: "#/components/schemas/Document"
        id:
          type: string
          example: app_01JB8Z5X0G6Q9T4V2W8Y3K7M1N
        number:
          type: string
          example: A-2026-000001
        product_code:
          type: string
          example: WORKING_CAPITAL
        purpose:
          $ref: "#/components/schemas/Purpose"
        representative:
          $ref: "#/components/schemas/Representative"
        requested:
          $ref: "#/components/schemas/RequestedTerms"
        status:
          description: |-
            DRAFT — создана при регистрации, SUBMITTED — анкета отправлена, ENRICHING — идёт сбор данных,
            VERIFYING — данные собраны, ждём проверку подписей, SCORING — оценивает credit-engine,
            MANUAL_REVIEW — у андеррайтера, WAITING_FOR_INFO — банк ждёт ответов клиента,
            OFFERED — выдано предложение, REJECTED — отказ.
          type: string
          enum:
            - DRAFT
            - SUBMITTED
            - ENRICHING
            - VERIFYING
            - SCORING
            - MANUAL_REVIEW
            - WAITING_FOR_INFO
            - OFFERED
            - REJECTED
            - SIGNING
            - COMPLETED
          example: DRAFT
        submitted_at:
          type: string
        updated_at:
          type: string
    ApplicationDraft:
      type: object
      properties:
        data:
          type: object
        updated_at:
          type: string
        version:
          type: integer
    Applications:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Application"
    BoApplicant:
      type: object
      properties:
        bank_relationship:
          type: object
          additionalProperties: {}
        credit_history:
          type: object
          additionalProperties: {}
        director_name:
          type: string
        enforcement:
          type: object
          additionalProperties: {}
        financial_statements:
          type: array
          items:
            $ref: "#/components/schemas/decision.YearFigures"
        full_name:
          type: string
        id:
          type: string
        inn:
          type: string
        kpp:
          type: string
        litigation:
          type: object
          additionalProperties: {}
        ogrn:
          type: string
        okved:
          type: string
        region:
          type: string
        registration_date:
          type: string
        risk_flags:
          type: array
          items:
            type: string
        short_name:
          type: string
        terminated_on:
          type: string
        type:
          type: string
    BoApplicantRef:
      type: object
      properties:
        id:
          type: string
        inn:
          type: string
        short_name:
          type: string
        type:
          type: string
          enum:
            - LEGAL_ENTITY
            - SOLE_PROPRIETOR
    BoApplicationListItem:
      type: object
      properties:
        applicant:
          $ref: "#/components/schemas/BoApplicantRef"
        assignee:
          $ref: "#/components/schemas/UserRef"
        degraded_sources:
          description: системы, ответившие с ошибкой или частично
          type: array
          items:
            type: string
        grade:
          type: string
          enum:
            - A
            - B
            - C
            - D
        id:
          type: string
        manual_review_reasons:
          description: Причины ручного рассмотрения от credit-engine — только у MANUAL_REVIEW.
          type: array
          items:
            type: string
        number:
          type: string
        product_code:
          type: string
        requested:
          $ref: "#/components/schemas/RequestedTerms"
        score:
          type: integer
        sla_due_at:
          type: string
        status:
          type: string
        submitted_at:
          type: string
        version:
          type: integer
    BoDecisionInput:
      type: object
      required:
        - action
      properties:
        action:
          type: string
          enum:
            - APPROVE
            - REJECT
            - REQUEST_INFO
        client_reasons:
          type: array
          items:
            $ref: "#/components/schemas/ClientReason"
        expert_adjustments:
          type: array
          items:
            $ref: "#/components/schemas/ExpertAdjustment"
        info_requests:
          type: array
          items:
            $ref: "#/components/schemas/InfoRequestInput"
        internal_comment:
          type: string
        offers:
          type: array
          items:
            $ref: "#/components/schemas/OfferInput"
    BoDossier:
      type: object
      properties:
        applicant:
          $ref: "#/components/schemas/BoApplicant"
        application:
          $ref: "#/components/schemas/Application"
        assignee:
          $ref: "#/components/schemas/UserRef"
        engine_decision:
          $ref: "#/components/schemas/BoEngineDecision"
        findings:
          type: array
          items:
            $ref: "#/components/schemas/BoFinding"
        info_requests:
          type: array
          items:
            $ref: "#/components/schemas/InfoRequest"
        offers:
          type: array
          items:
            $ref: "#/components/schemas/Offer"
        other_applications:
          type: array
          items:
            $ref: "#/components/schemas/BoApplicationListItem"
        score:
          $ref: "#/components/schemas/BoScore"
        sla_due_at:
          type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/BoSource"
        timeline:
          type: array
          items:
            $ref: "#/components/schemas/BoTimelineEvent"
        underwriter_decision:
          $ref: "#/components/schemas/BoUnderwriterDecision"
        version:
          description: для If-Match решения
          type: integer
    BoEngineDecision:
      type: object
      properties:
        engine_status:
          type: string
          enum:
            - APPROVED
            - REJECTED
            - UNDER_REVIEW
            - NEED_INFO
        outcome:
          description: "Итог движка для заявки: APPROVED, REJECTED, MANUAL_REVIEW, NEED_INFO."
          type: string
        proposed_terms:
          $ref: "#/components/schemas/BoTerms"
        reasons:
          type: array
          items:
            $ref: "#/components/schemas/BoEngineReason"
        review_reason:
          type: string
          enum:
            - BORROWER
            - BANK
    BoEngineReason:
      type: object
      properties:
        code:
          type: string
        fields:
          type: array
          items:
            type: string
        message:
          type: string
    BoFinding:
      type: object
      properties:
        code:
          type: string
        declared_value:
          type: string
        found_value:
          type: string
        material:
          type: boolean
        message:
          type: string
        severity:
          type: string
          enum:
            - INFO
            - WARN
            - STOP
        source:
          type: string
    BoQueue:
      type: object
      properties:
        counters:
          $ref: "#/components/schemas/BoQueueCounters"
        items:
          type: array
          items:
            $ref: "#/components/schemas/BoApplicationListItem"
        next_cursor:
          description: Курсор следующей страницы; null — страниц больше нет.
          type: string
    BoQueueCounters:
      type: object
      properties:
        due_today:
          type: integer
        manual_review:
          type: integer
        mine:
          type: integer
        waiting_for_info:
          type: integer
    BoScore:
      type: object
      properties:
        computed_at:
          type: string
        engine:
          type: string
          enum:
            - SCORECARD
        factors:
          type: array
          items:
            $ref: "#/components/schemas/BoScoreFactor"
        grade:
          type: string
          enum:
            - A
            - B
            - C
            - D
        model_version:
          type: string
        raw_total:
          type: number
        total:
          type: integer
    BoScoreFactor:
      type: object
      properties:
        answer:
          type: string
        code:
          type: string
        max_points:
          type: integer
        part:
          type: string
          enum:
            - QUESTIONNAIRE
            - ECONOMICS
        points:
          type: number
        title:
          type: string
        value:
          type: number
    BoSource:
      type: object
      properties:
        calls:
          type: integer
        code:
          description: "система data-collector: CORE_BANKING, FNS, BKI, …"
          type: string
        criticality:
          type: string
          enum:
            - CRITICAL
            - NORMAL
        duration_ms:
          type: integer
        failed_calls:
          type: integer
        fetched_at:
          type: string
        reason:
          type: string
        state:
          type: string
          enum:
            - DONE
            - PARTIAL
            - FAILED
            - SKIPPED
    BoTerms:
      type: object
      properties:
        amount:
          type: integer
        confirmed:
          description: условия подтверждены движком и банком (APPROVED)
          type: boolean
        monthly_payment:
          type: integer
        rate_annual:
          type: number
        term_months:
          type: integer
    BoTimelineEvent:
      type: object
      required:
        - actor_kind
        - at
        - id
        - message
        - type
      properties:
        actor:
          description: сотрудник банка
          allOf:
            - $ref: "#/components/schemas/UserRef"
        actor_kind:
          type: string
          enum:
            - CLIENT
            - SYSTEM
            - EMPLOYEE
        at:
          type: string
        from_status:
          type: string
        id:
          type: string
        internal:
          description: "служебное: клиенту не показывается"
          type: boolean
        message:
          type: string
          example: Данные о компании собраны
        to_status:
          type: string
        type:
          description: >-
            Тип события модуля: application.created, application.submitted, enrich.started, enrich.completed,
            enrich.failed,

            document.signatures_verified.
          type: string
          example: enrich.completed
    BoUnderwriterDecision:
      type: object
      properties:
        comment:
          type: string
        decided_at:
          type: string
        decided_by:
          $ref: "#/components/schemas/UserRef"
        outcome:
          type: string
          enum:
            - APPROVED
            - APPROVED_WITH_CHANGES
            - REJECTED
            - NEED_INFO
    CalculateRequest:
      type: object
      required:
        - amount
        - term_months
      properties:
        amount:
          type: integer
          example: 5000000
        term_months:
          type: integer
          example: 24
    Calculation:
      type: object
      properties:
        disclaimer:
          type: string
        monthly_payment_from:
          type: integer
          example: 251234
        rate_annual_from:
          type: number
          example: 18.5
    ClientDecision:
      type: object
      properties:
        decided_at:
          type: string
        decided_by:
          type: string
          enum:
            - ENGINE
            - EMPLOYEE
        outcome:
          type: string
          enum:
            - APPROVED
            - APPROVED_WITH_CHANGES
            - REJECTED
            - MANUAL_REVIEW
            - NEED_INFO
        reapply_after:
          description: когда можно подать заявку снова
          type: string
        reasons:
          description: Причины отказа для клиента — без баллов и внутренних проверок.
          type: array
          items:
            $ref: "#/components/schemas/domain.ClientReason"
    ClientReason:
      type: object
      properties:
        code:
          type: string
        description:
          type: string
        title:
          type: string
    Collateral:
      type: object
      properties:
        cadastral_numbers:
          description: недвижимость → ЕГРН
          type: array
          items:
            type: string
          example:
            - 50:21:0110203:845
        serials:
          description: техника → реестр залогов
          type: array
          items:
            type: string
          example:
            - JCB3CX2023118457
        vins:
          description: транспорт → реестр залогов
          type: array
          items:
            type: string
          example:
            - XTC652005N1498213
    CollectionSource:
      type: object
      properties:
        calls:
          type: integer
        duration_ms:
          type: integer
        failed_calls:
          type: integer
        reason:
          type: string
        source:
          type: string
          enum:
            - CORE_BANKING
            - FNS
            - BKI
            - COMPLIANCE
            - FSSP
            - KAD
            - FEDRESURS
            - M4D
            - TAX_REPORTS
            - PLEDGE_REGISTRY
            - EGRN
            - GOSUSLUGI
            - OPEN_BANKING
            - MARKETPLACES
            - OFD
            - ZAKUPKI
            - SIGNALS
            - CBR
            - HH
        state:
          type: string
          enum:
            - DONE
            - PARTIAL
            - FAILED
            - SKIPPED
    CollectionTask:
      type: object
      properties:
        application_id:
          type: string
          example: app_01JB8Z5X0G6Q9T4V2W8Y3K7M1N
        attempts:
          description: сколько раз worker брал задачу
          type: integer
          example: 0
        created_at:
          type: string
        document_ids:
          description: Документы, пришедшие с анкетой.
          type: array
          items:
            type: string
        error:
          description: почему FAILED
          type: string
        finished_at:
          type: string
        id:
          type: string
          example: tsk_01JB8Z5X0G6Q9T4V2W8Y3K7M1N
        inn:
          type: string
          example: "7799000012"
        questionnaire_id:
          type: string
          example: qst_01JB8Z5X0G6Q9T4V2W8Y3K7M1N
        raw_collection_id:
          type: string
          example: col_01JB8Z5X0G6Q9T4V2W8Y3K7M1N
        skipped_sources:
          description: "Системы, для которых в анкете нет данных (согласия, токена, залога, банков): они не опрашиваются."
          type: array
          items:
            type: string
          example:
            - EGRN
            - MARKETPLACES
        sources:
          description: "только у COMPLETED: состояние по каждой системе"
          type: array
          items:
            $ref: "#/components/schemas/CollectionSource"
        started_at:
          type: string
        status:
          description: PENDING — ждёт worker, RUNNING — системы опрашиваются, COMPLETED — сбор сохранён, FAILED — не
            выполнена.
          type: string
          enum:
            - PENDING
            - RUNNING
            - COMPLETED
            - FAILED
          example: PENDING
    CompanyAccess:
      type: object
      required:
        - applicant_id
        - can_sign
        - inn
        - role
        - short_name
      properties:
        applicant_id:
          type: string
          example: apl_north_wind
        can_sign:
          description: "Может подписать договор без доверенности: директор, у ИП — сам предприниматель."
